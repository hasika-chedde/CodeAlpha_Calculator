<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>

  <!-- Space Mono for the digit display, Inter for everything else -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="calculator" id="calculator">

    <h1 class="calc-heading">Simple Calculator</h1>

    <!-- ============ DISPLAY ============ -->
    <div class="display" id="display">
      <!-- Shows the pending calculation, e.g. "12 + 4" -->
      <div class="display-expression" id="expression"></div>
      <!-- Shows the number currently being typed, or the result -->
      <div class="display-current" id="current">0</div>
    </div>

    <!-- ============ BUTTON GRID ============ -->
    <div class="keys">

      <button class="key key--fn" data-action="clear">C</button>
      <button class="key key--fn" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key key--fn" data-action="percent">%</button>
      <button class="key key--op" data-action="operator" data-operator="÷">÷</button>

      <button class="key key--num" data-action="number" data-value="7">7</button>
      <button class="key key--num" data-action="number" data-value="8">8</button>
      <button class="key key--num" data-action="number" data-value="9">9</button>
      <button class="key key--op" data-action="operator" data-operator="×">×</button>

      <button class="key key--num" data-action="number" data-value="4">4</button>
      <button class="key key--num" data-action="number" data-value="5">5</button>
      <button class="key key--num" data-action="number" data-value="6">6</button>
      <button class="key key--op" data-action="operator" data-operator="−">−</button>

      <button class="key key--num" data-action="number" data-value="1">1</button>
      <button class="key key--num" data-action="number" data-value="2">2</button>
      <button class="key key--num" data-action="number" data-value="3">3</button>
      <button class="key key--op" data-action="operator" data-operator="+">+</button>

      <button class="key key--num key--zero" data-action="number" data-value="0">0</button>
      <button class="key key--num" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
